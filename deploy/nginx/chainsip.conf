server {
    # 前端静态资源 + /api 反向代理到本机 Spring Boot
    # 放置位置：/etc/nginx/conf.d/chainsip.conf
    # 若已有 default_server，去掉下面这行的 default_server 并改成独立 server_name
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/chainsip/frontend;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    # 接口返回多为 JSON，压缩收益明显（后端自己也开了压缩，这里再兜一层静态资源）
    gzip on;
    gzip_vary on;
    gzip_min_length 2048;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    access_log /var/log/nginx/chainsip.access.log;
    error_log  /var/log/nginx/chainsip.error.log warn;

    # 上链交易最长 15s（chainsip.chain.timeout-millis），代理超时留余量，
    # 否则缴费这类写接口会在 nginx 层先 504，而链上其实已经成功
    proxy_connect_timeout 10s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 构建产物带 hash，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，否则发版后用户还拿着旧 index.html 去请求已删除的 chunk
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 回退（当前用 hash 路由，这条是给以后换 history 路由留的）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
